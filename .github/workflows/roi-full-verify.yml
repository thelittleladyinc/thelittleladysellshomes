name: ROI Full Verify

on:
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Run existing regression suites
        run: bash tests/run-all.sh
      - name: Run ROI source checks
        run: python3 tests/test-roi-conversion.py
      - name: Build production output with all gates
        run: bash scripts/netlify-build.sh
      - name: Verify contact form static attribution output
        run: |
          python3 - <<'PY'
          from pathlib import Path
          html = Path('site/contact.html').read_text(encoding='utf-8')
          start = html.index('<form class="lead-form" name="contact"')
          end = html.index('</form>', start)
          form = html[start:end]
          fields = [
              'attribution_first_page','attribution_form_page','attribution_source',
              'attribution_referrer','utm_source','utm_medium','utm_campaign',
              'utm_content','utm_term','roi_context'
          ]
          missing = [f for f in fields if f'name="{f}"' not in form]
          if missing:
              raise SystemExit('contact form missing static fields: ' + ', '.join(missing))
          print('contact form static attribution: PASS')
          PY
