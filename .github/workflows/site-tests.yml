name: Site regression

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: site-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Run production build and regression suites
        run: bash tests/run-all.sh
